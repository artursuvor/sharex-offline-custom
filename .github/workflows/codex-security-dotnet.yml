name: Temporary NuGet security audit
on:
  push:
    branches: [codex/security-audit-2026-10-30]
    paths: [.github/workflows/codex-security-dotnet.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "10.0.x"
      - name: Restore and audit transitive NuGet dependencies
        shell: pwsh
        run: |
          dotnet restore ShareX.sln -p:NuGetAudit=true -p:NuGetAuditMode=all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet list ShareX.sln package --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
